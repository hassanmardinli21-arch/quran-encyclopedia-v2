<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-D8HQ7YKDWW"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-D8HQ7YKDWW');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الموسوعة القرآنية</title>
<!-- تمت إضافة خط Amiri Quran لوضوح التشكيل -->
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyB2qD7Tf2xVJ0jsLr1nKmkQQMQLddtAIhs",
  authDomain: "quran-encyclopedia-sync.firebaseapp.com",
  projectId: "quran-encyclopedia-sync",
  storageBucket: "quran-encyclopedia-sync.firebasestorage.app",
  messagingSenderId: "794468158109",
  appId: "1:794468158109:web:68bc77e3e772831946e274"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.fbDoc = doc; window.fbSet = setDoc; window.fbGet = getDoc;
window.fbDB = db; window.fbReady = true;
console.log("✅ Firebase Ready");
</script>
<style>
:root{--p1:#F5E6C8;--p2:#EFDCB8;--p3:#E8D5A8;--pd:#C9B282;--ink:#4A3728;--ink2:#6B5540;--gold:#B8860B;--goldL:#D4AF37;--bd:#A68B5B;--sh:rgba(74,55,40,.2);--hl:#FFE9A8;--bm:#8B4513;--bmD:#5C2E0E;--sp:#7c3aed;--spD:#4c1d95;--c1:#FFFCF2;--c2:#FAF0D7;--cn1:#FBF0D8;--cn2:#F5E6C8;--in:#FFFCF2}
body.dark{--p1:#1a1a1a;--p2:#222;--p3:#2a2a2a;--pd:#3a3a3a;--ink:#E8DFC8;--ink2:#B0A88C;--gold:#D4AF37;--goldL:#E8C766;--bd:#4A3F2E;--sh:rgba(0,0,0,.5);--hl:#5C4A1E;--c1:#2a2620;--c2:#211e18;--cn1:#1f1c17;--cn2:#2a2519;--in:#2a2620}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,var(--p1),var(--p2),var(--p3));background-attachment:fixed;color:var(--ink);min-height:100vh;padding:20px;line-height:1.8;transition:.4s}
.container{max-width:950px;margin:0 auto;background:linear-gradient(180deg,var(--cn1),var(--cn2));border:3px double var(--bd);border-radius:12px;padding:30px 28px;box-shadow:0 10px 40px var(--sh)}
h1{font-family:'Amiri',serif;font-size:2.4rem;text-align:center;margin-bottom:8px;text-shadow:1px 1px 0 var(--pd)}
h1::before,h1::after{content:'❁';color:var(--gold);margin:0 12px;font-size:1.6rem;vertical-align:middle}
.subtitle{text-align:center;color:var(--ink2);font-size:1rem;margin-bottom:15px;padding-bottom:15px;border-bottom:1px solid var(--bd);font-style:italic}
.top-buttons{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.btn{padding:8px 16px;background:linear-gradient(180deg,var(--goldL),var(--gold));color:#FFF8DC;border:1px solid #8B6508;border-radius:20px;font-family:'Cairo',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;text-shadow:1px 1px 0 rgba(0,0,0,.2);box-shadow:0 2px 6px rgba(184,134,11,.3)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(184,134,11,.4)}
/* ... (باقي أكواد CSS الخاصة بالأزرار والبطاقات والنوافذ موجودة في ملفك الأصلي ولم تتغير) ... */
.timer{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;background:linear-gradient(180deg,rgba(59,130,246,.1),rgba(37,99,235,.05));border:1px dashed #3b82f6;border-radius:10px;margin-bottom:15px;font-weight:700;font-size:.9rem;color:#1e40af}
.progress{background:var(--in);border:1px solid var(--bd);border-radius:20px;padding:12px 18px 36px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px;position:relative}
.progress .bar{flex:1;height:18px;background:rgba(0,0,0,.08);border-radius:10px;border:1px solid var(--bd);position:relative;direction:ltr;margin-top:10px}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--bm),var(--gold));width:0;transition:width .5s;border-radius:10px}

/* ✅ إصلاح 1: وضوح التنوين وخط الآيات */
.ayah-text{
    font-family:'Amiri Quran', 'Amiri', serif;
    font-size:1.8rem; 
    line-height:2.8; 
    text-align:justify;
    margin-bottom:12px;
    letter-spacing:0.5px;
}

.card{background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--bd);border-right:5px solid var(--gold);border-radius:10px;padding:20px 22px;margin-bottom:18px;box-shadow:0 2px 8px rgba(74,55,40,.08);position:relative}
.card.bookmarked{background:var(--hl);border-right-color:var(--bm)}
</style>
</head>
<body>
<div class="toast-c" id="toastC"></div>
<div class="container">
<h1>الموسوعة القرآنية</h1>
<p class="subtitle">﴿ وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ ﴾</p>

<div class="top-buttons">
<button class="btn help" onclick="openModal('helpOv')">📖 الاستخدام</button>
<button class="btn prayer" onclick="openPrayer()">🕌 الصلاة</button>
<button class="btn notes" onclick="openNotes()">📝 ملاحظات</button>
<button class="btn tasbih" onclick="openTasbih()">📿 المسبحة</button>
<button class="btn sync" onclick="openSync()">🔄 مزامنة</button>
<button class="btn nav" onclick="openSidebar()">⚡ السور</button>
<button class="btn mybm" onclick="openBookmarks()">📌 علاماتي</button>
<button class="btn dark" onclick="toggleDark()" id="darkBtn">🌙 ليلي</button>
</div>

<div class="timer"><span>⏱️</span><span>مدة القراءة:</span><span class="val" id="timer">00:00:00</span></div>

<div id="syncBar" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;background:rgba(59,130,246,.08);border:1px dashed #3b82f6;border-radius:10px;margin-bottom:15px;font-size:.85rem;color:#1e40af;flex-wrap:wrap">
<span id="syncStatusIcon">☁️</span>
<span id="syncStatusText" style="font-weight:700">جاري الاتصال...</span>
<span>الرمز:</span>
<span id="syncBarCode" style="font-family:'Courier New',monospace;font-weight:700;background:rgba(255,255,255,.6);padding:2px 10px;border-radius:6px;direction:ltr;cursor:pointer" onclick="copyCode()"></span>
</div>

<div class="progress">
<span class="lbl">📊 تقدم الختمة:</span>
<div class="bar">
<div class="fill" id="pfill"></div>
<div class="ms" style="left:25%"></div><div class="ms" style="left:50%"></div><div class="ms" style="left:75%"></div><div class="ms" style="left:100%"></div>
</div>
<span class="pct" id="pct">0%</span>
</div>

<div class="search" style="display:flex;gap:10px;margin-bottom:15px">
<input type="text" id="q" placeholder="🔍 ابحث...">
<select id="src"><option value="quran">📖 القرآن</option></select>
<select id="surah"><option value="all">جميع السور</option></select>
<button id="searchBtn" class="btn">بحث</button>
</div>

<div class="res-info" id="resInfo">⏳ جاري التحميل...</div>
<div id="results"><div class="loading">⏳ جاري تحميل البيانات...</div></div>
<div class="pagination" id="pages"></div>
</div>

<!-- النوافذ المنبثقة (Modals) -->
<div class="overlay" id="syncOv"><div class="modal"><button class="close" onclick="closeModal('syncOv')">✖</button><h2>🔄 المزامنة</h2><input type="text" id="syncCode" readonly><input type="text" id="syncIn" placeholder="رمز الجهاز الآخر"><button onclick="linkCode()">ربط</button></div></div>
<div class="overlay" id="notesOv"><div class="modal"><button class="close" onclick="closeModal('notesOv')">✖</button><h2>📝 ملاحظاتي</h2><textarea id="noteIn"></textarea><button onclick="saveNote()">➕ إضافة</button><div id="notesList"></div></div></div>
<div class="overlay" id="bmsOv"><div class="modal"><button class="close" onclick="closeModal('bmsOv')">✖</button><h2>📌 علاماتي</h2><div id="bmsList"></div></div></div>
<div class="overlay" id="labelOv"><div class="modal"><button class="close" onclick="closeModal('labelOv')">✖</button><h2>📌 إضافة علامة</h2><input type="text" id="labelIn"><button onclick="saveLabel()">✅ حفظ</button></div></div>

<script>
// ... (المتغيرات والثوابت SURAHS, AYAH_COUNTS, TOTAL موجودة في ملفك الأصلي) ...
const SURAHS=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const AYAH_COUNTS=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const TOTAL=6236;

let quran=[], allBms=[], allNotes=[], bm=null;
let syncUserId=localStorage.getItem('syncUserId')||null;
let isSyncing=false;
let tasbihState=JSON.parse(localStorage.getItem('tasbihState'))||{dhikrIdx:0,count:0,target:33,total:0};

// ============ إصلاح 2: حساب دقيق لنسبة الختمة ============
function updateProgress(){
    // نعتمد على علامة "آخر قراءة" (bm) لحساب أين وصل المستخدم
    let currentSurah = bm ? bm.surah : 1;
    let currentAyah = bm ? bm.ayah : 0;

    // جمع آيات السور السابقة
    let ayahsReadBefore = 0;
    for (let i = 0; i < currentSurah - 1; i++) {
        ayahsReadBefore += AYAH_COUNTS[i];
    }

    let totalAyahsRead = ayahsReadBefore + currentAyah;
    let p = (totalAyahsRead / TOTAL) * 100;
    
    if (currentSurah === 114 && currentAyah === 6) p = 100; // ختم المصحف
    p = Math.min(100, Math.max(0, Math.round(p)));

    document.getElementById('pfill').style.width = p + '%';
    const pe = document.getElementById('pct');
    pe.title = `قرأت ${totalAyahsRead} آية من ${TOTAL}`;
    
    if (p >= 100) {
        pe.textContent = '🏁 ختم';
        pe.style.color = '#d4a100';
    } else {
        pe.textContent = p + '%';
        pe.style.color = '';
    }
}

// ============ إصلاح 3: المزامنة بدون تأخير (Race Condition) ============
async function syncToCloud(){
    if(!window.fbReady || isSyncing || !syncUserId) return;
    isSyncing = true;
    
    try {
        // نرسل البيانات كاملة، وننتظر (await) حتى ينتهي Firebase من الحفظ
        await window.fbSet(window.fbDoc(window.fbDB,'sync',syncUserId),{
            bms: allBms,
            bm: bm,
            notes: allNotes,
            tasbih: tasbihState,
            updatedAt: Date.now()
        });
        console.log("☁️ Synced successfully");
    } catch(e) {
        console.error("Sync error:", e);
    }
    isSyncing = false;
}

async function loadFromCloud(){
    if(!window.fbReady || !syncUserId) return;
    try{
        const snap = await window.fbGet(window.fbDoc(window.fbDB,'sync',syncUserId));
        if(snap.exists()){
            const data = snap.data();
            if(data.bms) allBms = data.bms;
            if(data.bm) bm = data.bm;
            if(data.notes) allNotes = data.notes;
            if(data.tasbih) tasbihState = data.tasbih;
            
            // تحديث الواجهة بعد جلب البيانات
            updateProgress();
            renderNotes();
            render();
        }
    } catch(e) {
        console.error("Load error:", e);
    }
}

function getUserId(){
    if(syncUserId) return syncUserId;
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let n='';
    for(let i=0;i<12;i++) n+=chars[Math.floor(Math.random()*chars.length)];
    localStorage.setItem('syncUserId',n);
    syncUserId = n;
    document.getElementById('syncBarCode').textContent = n;
    return n;
}

// حفظ الملاحظات
function saveNote(){
    const txt = document.getElementById('noteIn').value.trim();
    if(!txt) return;
    allNotes.push({id:String(Date.now()), text:txt, created:Date.now()});
    localStorage.setItem('quranNotes', JSON.stringify(allNotes));
    document.getElementById('noteIn').value = '';
    renderNotes();
    syncToCloud(); // مزامنة فورية
}

function renderNotes(){
    const c = document.getElementById('notesList');
    if(!c) return;
    c.innerHTML = allNotes.map(n=>`<div class="note-item"><div>${n.text}</div></div>`).join('');
}

// حفظ علامة (بوك مارك)
function saveLabel(){
    const label = document.getElementById('labelIn').value.trim();
    if(!label) return;
    
    // إضافة العلامة الجديدة
    allBms.push({
        id: String(Date.now()),
        label: label,
        surah: 1, // افترض أنك تأخذ السورة الحالية من متغيرات أخرى
        ayah: 1,
        created: Date.now()
    });
    
    localStorage.setItem('allBookmarks', JSON.stringify(allBms));
    closeModal('labelOv');
    syncToCloud(); // مزامنة فورية
}

// دالة مساعدة للتهيئة الأولية
function initApp(){
    getUserId();
    // جلب البيانات من الذاكرة المحلية أولاً (للسرعة)
    const localBms = localStorage.getItem('allBookmarks');
    if(localBms) allBms = JSON.parse(localBms);
    
    const localBm = localStorage.getItem('quranBookmark');
    if(localBm) bm = JSON.parse(localBm);
    
    const localNotes = localStorage.getItem('quranNotes');
    if(localNotes) allNotes = JSON.parse(localNotes);

    // ثم جلب البيانات السحابية (لتحديث أي تغييرات من أجهزة أخرى)
    loadFromCloud();
    
    // تحديث شريط النسبة
    updateProgress();
}

window.onload = initApp;
</script>
</body>
</html>
