<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموسوعة القرآنية - التفاسير</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment-1: #F5E6C8; --parchment-2: #EFDCB8; --parchment-3: #E8D5A8;
            --parchment-dark: #C9B282; --ink-primary: #4A3728; --ink-secondary: #6B5540;
            --gold: #B8860B; --gold-light: #D4AF37; --border-color: #A68B5B;
            --shadow: rgba(74, 55, 40, 0.2); --highlight-bg: #FFE9A8; --highlight-border: #E6C34A;
            --bookmark-color: #8B4513; --bookmark-dark: #5C2E0E;
            --special-color: #7c3aed; --special-dark: #4c1d95;
            --card-bg-1: #FFFCF2; --card-bg-2: #FAF0D7;
            --container-bg-1: #FBF0D8; --container-bg-2: #F5E6C8;
            --input-bg: #FFFCF2;
        }
        body.dark-mode {
            --parchment-1: #1a1a1a; --parchment-2: #222222; --parchment-3: #2a2a2a;
            --parchment-dark: #3a3a3a; --ink-primary: #E8DFC8; --ink-secondary: #B0A88C;
            --gold: #D4AF37; --gold-light: #E8C766; --border-color: #4A3F2E;
            --shadow: rgba(0, 0, 0, 0.5); --highlight-bg: #5C4A1E; --highlight-border: #B8860B;
            --card-bg-1: #2a2620; --card-bg-2: #211e18;
            --container-bg-1: #1f1c17; --container-bg-2: #2a2519; --input-bg: #2a2620;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(184, 134, 11, 0.06) 0%, transparent 50%), linear-gradient(135deg, var(--parchment-1) 0%, var(--parchment-2) 50%, var(--parchment-3) 100%); background-attachment: fixed; color: var(--ink-primary); min-height: 100vh; padding: 20px; line-height: 1.8; transition: background 0.4s, color 0.4s; }
        body::before { content: ''; position: fixed; inset: 0; background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 109, 66, 0.03) 2px, rgba(139, 109, 66, 0.03) 4px), repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(139, 109, 66, 0.03) 2px, rgba(139, 109, 66, 0.03) 4px); pointer-events: none; z-index: 0; }
        body.dark-mode::before { opacity: 0.3; }
        .container { position: relative; z-index: 1; max-width: 950px; margin: 0 auto; background: linear-gradient(180deg, var(--container-bg-1) 0%, var(--container-bg-2) 100%); border: 3px double var(--border-color); border-radius: 12px; padding: 30px 28px; box-shadow: 0 0 0 1px rgba(184, 134, 11, 0.2), 0 10px 40px var(--shadow); }
        h1 { font-family: 'Amiri', serif; font-size: 2.4rem; text-align: center; color: var(--ink-primary); margin-bottom: 8px; text-shadow: 1px 1px 0 var(--parchment-dark); }
        h1::before, h1::after { content: '❁'; color: var(--gold); margin: 0 12px; font-size: 1.6rem; vertical-align: middle; }
        .subtitle { text-align: center; color: var(--ink-secondary); font-size: 1rem; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); font-style: italic; }
        .top-buttons { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .about-btn { padding: 8px 16px; background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 100%); color: #FFF8DC; border: 1px solid #8B6508; border-radius: 20px; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); transition: 0.2s; box-shadow: 0 2px 6px rgba(184, 134, 11, 0.3); }
        .about-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(184, 134, 11, 0.4); }
        .about-btn.sync { background: linear-gradient(180deg,#38bdf8,#0284c7); border-color:#075985; }
        .about-btn.dark { background: linear-gradient(180deg,#6b7280,#374151); border-color:#1f2937; }
        .about-btn.nav { background: linear-gradient(180deg,#a78bfa,#7c3aed); border-color:#5b21b6; }
        .about-btn.bm-color { background: linear-gradient(180deg,#f59e0b,#b45309); border-color:#78350f; }
        .about-btn.my-bm { background: linear-gradient(180deg,#a78bfa,#7c3aed); border-color:#5b21b6; }
        .about-btn.help { background: linear-gradient(180deg,#10b981,#047857); border-color:#065f46; }
        .about-btn.wake { background: linear-gradient(180deg,#fbbf24,#d97706); border-color:#92400e; }
        .about-btn.wake.active { background: linear-gradient(180deg,#f59e0b,#b45309); border-color:#78350f; box-shadow: 0 0 0 2px rgba(251,191,36,0.5), 0 4px 12px rgba(217,119,6,0.5); animation: wakePulse 2s ease-in-out infinite; }
        @keyframes wakePulse { 0%,100% { box-shadow: 0 0 0 2px rgba(251,191,36,0.5), 0 4px 12px rgba(217,119,6,0.5); } 50% { box-shadow: 0 0 0 4px rgba(251,191,36,0.3), 0 4px 16px rgba(217,119,6,0.7); } }
        .about-btn.lock { background: linear-gradient(180deg,#ef4444,#b91c1c); border-color:#7f1d1d; }
        .about-btn.lock.active { background: linear-gradient(180deg,#dc2626,#991b1b); border-color:#7f1d1d; box-shadow: 0 0 0 2px rgba(239,68,68,0.5); animation: lockPulse 2s ease-in-out infinite; }
        @keyframes lockPulse { 0%,100% { box-shadow: 0 0 0 2px rgba(239,68,68,0.5); } 50% { box-shadow: 0 0 0 5px rgba(239,68,68,0.3); } }

        .reading-timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            background: linear-gradient(180deg, rgba(59,130,246,0.1), rgba(37,99,235,0.05));
            border: 1px dashed #3b82f6;
            border-radius: 10px;
            margin-bottom: 15px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            color: #1e40af;
        }
        body.dark-mode .reading-timer { color: #60a5fa; }
        .reading-timer .timer-icon { font-size: 1.1rem; }
        .reading-timer .timer-value {
            font-family: 'Courier New', monospace;
            font-size: 1.05rem;
            background: rgba(255,255,255,0.5);
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid rgba(59,130,246,0.3);
            color: #1d4ed8;
        }
        body.dark-mode .reading-timer .timer-value { background: rgba(0,0,0,0.3); color: #93c5fd; }

        /* ====== قفل الشاشة ====== */
        .screen-lock-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.05);
            z-index: 9997;
            cursor: not-allowed;
        }
        .screen-lock-overlay.active { display: block; }
        
        /* الزر العائم للقفل - يتحرك مع الشاشة */
        .screen-lock-float {
            display: none;
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 14px 28px;
            background: linear-gradient(180deg, #dc2626, #991b1b);
            color: white;
            border: 3px solid white;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.6), 0 0 0 4px rgba(220, 38, 38, 0.2);
            transition: all 0.3s ease;
            animation: lockFloatPulse 2s ease-in-out infinite;
            user-select: none;
            white-space: nowrap;
        }
        .screen-lock-float.active { display: flex; align-items: center; gap: 10px; }
        .screen-lock-float:hover { transform: translateX(-50%) translateY(-3px); box-shadow: 0 12px 40px rgba(220, 38, 38, 0.7); }
        .screen-lock-float:active { transform: translateX(-50%) translateY(-1px); }
        @keyframes lockFloatPulse {
            0%, 100% { box-shadow: 0 8px 30px rgba(220, 38, 38, 0.6), 0 0 0 4px rgba(220, 38, 38, 0.2); }
            50% { box-shadow: 0 8px 30px rgba(220, 38, 38, 0.6), 0 0 0 10px rgba(220, 38, 38, 0.05); }
        }
        
        /* رسالة القفل العلوية (شارة صغيرة) */
        .screen-lock-badge {
            display: none;
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 8px 20px;
            background: linear-gradient(180deg, #dc2626, #991b1b);
            color: white;
            border-radius: 30px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.5);
            animation: slideDown 0.4s ease;
            user-select: none;
            pointer-events: none;
        }
        .screen-lock-badge.active { display: flex; align-items: center; gap: 8px; }
        @keyframes slideDown {
            from { transform: translate(-50%, -100px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* ====== Toast (رسالة تأكيد) ====== */
        .toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            max-width: 90vw;
        }
        .toast {
            background: linear-gradient(180deg, #10b981, #047857);
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s;
            border: 2px solid rgba(255,255,255,0.3);
            pointer-events: auto;
            max-width: 100%;
        }
        .toast.toast-bookmark { background: linear-gradient(180deg, var(--bookmark-color), var(--bookmark-dark)); box-shadow: 0 8px 25px rgba(92, 46, 14, 0.5); }
        .toast.toast-special { background: linear-gradient(180deg, #7c3aed, #4c1d95); box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5); }
        .toast.toast-info { background: linear-gradient(180deg, #3b82f6, #1d4ed8); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5); }
        .toast.toast-warning { background: linear-gradient(180deg, #f59e0b, #b45309); box-shadow: 0 8px 25px rgba(217, 119, 6, 0.5); }
        .toast .toast-icon { font-size: 1.3rem; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-30px) scale(0.9); }
        }

        .ayah-card.temp-highlight { animation: tempHighlight 1.5s ease; }
        @keyframes tempHighlight {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
            30% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.7), 0 8px 30px rgba(245, 158, 11, 0.5); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .progress-wrap { background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 12px 18px 36px 18px; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 12px; position: relative; }
        .progress-label { font-size: 0.85rem; font-weight: 700; color: var(--ink-primary); white-space: nowrap; padding-top: 12px; }
        .progress-bar { flex: 1; height: 18px; background: rgba(0,0,0,0.08); border-radius: 10px; border: 1px solid var(--border-color); position: relative; direction: ltr; margin-top: 10px; }
        body.dark-mode .progress-bar { background: rgba(255,255,255,0.08); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--bookmark-color) 0%, var(--gold) 100%); width: 0%; transition: width 0.5s ease; border-radius: 10px; position: relative; z-index: 1; }
        .progress-percent { font-size: 0.9rem; font-weight: 700; color: var(--bookmark-dark); min-width: 50px; text-align: left; padding-top: 12px; transition: color 0.3s; cursor: help; }
        body.dark-mode .progress-percent { color: var(--gold-light); }
        .milestone { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-secondary); border-radius: 2px; z-index: 3; transform: translateX(-50%); transition: all 0.3s; opacity: 0.5; }
        .milestone.reached { background: #16a34a; box-shadow: 0 0 8px rgba(22, 163, 74, 0.8); width: 3px; opacity: 1; }
        .milestone[data-pct="100"] { background: var(--gold); width: 3px; opacity: 0.8; }
        .milestone[data-pct="100"].reached { background: #d4a100; box-shadow: 0 0 14px #d4a100; width: 4px; opacity: 1; animation: goldenPulse 2s ease-in-out infinite; }
        @keyframes goldenPulse { 0%, 100% { box-shadow: 0 0 8px #d4a100; transform: translateX(-50%) scale(1); } 50% { box-shadow: 0 0 20px #d4a100, 0 0 30px rgba(212, 161, 0, 0.6); transform: translateX(-50%) scale(1.3); } }
        .milestone-label { position: absolute; top: 24px; transform: translateX(-50%); font-size: 0.7rem; font-weight: 700; color: var(--ink-secondary); white-space: nowrap; z-index: 4; transition: color 0.3s; padding: 2px 6px; background: var(--input-bg); border-radius: 6px; border: 1px solid transparent; opacity: 0.7; }
        .milestone-label.reached { color: #16a34a; border-color: rgba(22, 163, 74, 0.3); opacity: 1; }
        .milestone-label[data-pct="100"] { color: var(--gold); opacity: 0.85; }
        .milestone-label[data-pct="100"].reached { color: #d4a100; border-color: rgba(212, 161, 0, 0.4); background: rgba(212, 161, 0, 0.1); opacity: 1; }
        .bookmark-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; background: linear-gradient(180deg, var(--bookmark-color) 0%, var(--bookmark-dark) 100%); border: 2px solid #3D1F08; border-radius: 10px; margin-bottom: 15px; flex-wrap: wrap; box-shadow: 0 4px 12px rgba(92, 46, 14, 0.4); }
        .bookmark-info { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; color: #FFFFFF; flex: 1; min-width: 200px; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3); flex-wrap: wrap; }
        .bookmark-info .ribbon-icon { font-size: 1.3rem; }
        .bookmark-info strong { color: #FFD98A; }
        .bookmark-info #bookmarkLocation { font-weight: 700; color: #FFFFFF; }
        .bookmark-info #hereMsg { display: none; background: #16a34a; color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; animation: pulse 2s ease-in-out infinite; }
        .bookmark-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .bookmark-jump-btn, .bookmark-clear-btn { padding: 8px 14px; border-radius: 8px; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.2s; border: none; }
        .bookmark-jump-btn { background: linear-gradient(180deg, #E8A317 0%, #B8860B 100%); color: white; }
        .bookmark-jump-btn:hover { transform: translateY(-1px); }
        .bookmark-jump-btn.at-location { background: linear-gradient(180deg, #16a34a 0%, #15803d 100%) !important; box-shadow: 0 0 0 2px rgba(255,255,255,0.3); animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .bookmark-clear-btn { background: rgba(220, 38, 38, 0.85); color: white; border: 1px solid #fca5a5; }
        .search-box { display: flex; flex-wrap: wrap; gap: 10px; background: var(--input-bg); padding: 15px; border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 15px; }
        .search-box input, .search-box select { flex: 1; min-width: 120px; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--input-bg); color: var(--ink-primary); font-family: 'Cairo', sans-serif; font-size: 1rem; outline: none; }
        .search-box input:focus, .search-box select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.15); }
        .search-box button { padding: 12px 28px; background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 100%); color: #FFF8DC; border: 1px solid #8B6508; border-radius: 8px; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; }
        .tafsir-toggle-bar { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 18px; background: var(--input-bg); border: 1px dashed var(--border-color); border-radius: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tafsir-toggle-bar label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; color: var(--ink-primary); font-size: 0.95rem; padding: 6px 14px; border-radius: 20px; }
        .tafsir-toggle-bar input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--gold); }
        .toggle-hint { font-size: 0.85rem; color: var(--ink-secondary); font-style: italic; }
        .results-info { text-align: center; color: var(--ink-secondary); font-size: 0.95rem; margin-bottom: 20px; padding: 8px; background: var(--input-bg); border-radius: 6px; border: 1px dashed var(--border-color); }
        .surah-suggestion { background: linear-gradient(180deg, #10b981 0%, #047857 100%); color: white; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); animation: suggestionIn 0.5s ease; }
        @keyframes suggestionIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .surah-suggestion-text { font-family: 'Cairo', sans-serif; font-size: 1rem; font-weight: 700; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .surah-suggestion button { padding: 10px 20px; background: white; color: #047857; border: none; border-radius: 8px; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .surah-suggestion button:hover { transform: scale(1.05); background: #f0fdf4; }
        .show-context-btn { background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; border-radius: 20px; padding: 4px 12px; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 0.75rem; cursor: pointer; box-shadow: 0 2px 6px rgba(59,130,246,0.4); transition: 0.2s; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
        .show-context-btn:hover { transform: translateY(-1px) scale(1.05); box-shadow: 0 4px 10px rgba(59,130,246,0.5); }
        .ayah-card { background: linear-gradient(180deg, var(--card-bg-1) 0%, var(--card-bg-2) 100%); border: 1px solid var(--border-color); border-right: 5px solid var(--gold); border-radius: 10px; padding: 20px 22px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(74, 55, 40, 0.08); position: relative; transition: box-shadow 0.3s ease; }
        .ayah-card::before { content: '۞'; position: absolute; top: 8px; left: 12px; color: var(--gold); font-size: 1.4rem; opacity: 0.5; }
        .ayah-card.bookmarked { background: var(--highlight-bg); border-right-color: var(--bookmark-color); box-shadow: 0 0 0 3px rgba(232, 163, 23, 0.35), 0 6px 20px rgba(232, 163, 23, 0.3); }
        .ayah-card.focused { box-shadow: 0 0 0 5px #f59e0b, 0 8px 30px rgba(245, 158, 11, 0.6) !important; animation: focusPulse 0.8s ease-in-out 3; border-right-color: #f59e0b !important; }
        @keyframes focusPulse { 0%, 100% { box-shadow: 0 0 0 5px #f59e0b, 0 8px 30px rgba(245, 158, 11, 0.6); } 50% { box-shadow: 0 0 0 8px #d97706, 0 8px 40px rgba(217, 119, 6, 0.8); } }
        .bookmark-ribbon { position: absolute; top: -12px; left: 20px; background: linear-gradient(180deg, var(--bookmark-color) 0%, var(--bookmark-dark) 100%); color: white; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; box-shadow: 0 3px 8px rgba(92, 46, 14, 0.5); z-index: 2; white-space: nowrap; }
        .special-ribbon { position: absolute; top: -12px; right: 20px; background: linear-gradient(180deg, var(--special-color) 0%, var(--special-dark) 100%); color: white; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; box-shadow: 0 3px 8px rgba(124, 58, 237, 0.5); z-index: 2; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
        .ayah-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--parchment-dark); flex-wrap: wrap; gap: 8px; }
        .ayah-header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .ayah-ref { background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 100%); color: #FFF8DC; padding: 4px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
        .ayah-type { font-size: 0.8rem; color: var(--ink-secondary); background: rgba(201, 178, 130, 0.3); padding: 3px 12px; border-radius: 12px; border: 1px solid var(--parchment-dark); }
        .ayah-btns { display: flex; gap: 6px; align-items: center; }
        .bookmark-btn, .special-btn { background: rgba(255, 248, 220, 0.7); border: 1px solid var(--border-color); color: var(--ink-secondary); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: all 0.25s; padding: 0; line-height: 1; }
